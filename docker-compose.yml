services:
  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
    volumes:
      - db-data:/var/lib/postgresql/data

  odoo:
    image: odoo:19
    depends_on:
      - db
    ports:
      - "8069:8069"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=odoo
      - DB_PASSWORD=odoo
      - ADMIN_PASSWD=password   # master password for DB creation
    volumes:
      - ./vehicle_maintenance_workshop:/mnt/extra-addons/vehicle_maintenance_workshop
      - ./config:/etc/odoo

volumes:
  db-data:
